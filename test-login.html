<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
</head>
<body>
    <h1>Test Login</h1>
    <form id="loginForm">
        <div>
            <label>Email: <input type="email" id="email" value="analyst@example.com"></label>
        </div>
        <div>
            <label>Password: <input type="password" id="password" value="password123"></label>
        </div>
        <button type="submit">Login</button>
    </form>
    <pre id="result"></pre>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultEl = document.getElementById('result');

            resultEl.textContent = 'Sending request...';

            try {
                const response = await fetch('http://localhost:3070/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                resultEl.textContent = `Status: ${response.status}\n\nResponse:\n${JSON.stringify(data, null, 2)}`;

                if (response.ok) {
                    setTimeout(() => {
                        window.location.href = 'http://localhost:3070/assignments';
                    }, 1000);
                }
            } catch (error) {
                resultEl.textContent = `Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
