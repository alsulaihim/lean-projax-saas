name: CD - Deploy to Staging

# Deploy when code is pushed to staging branch
# Automatically deploys to Railway staging environment

on:
  push:
    branches: [staging]
  workflow_dispatch: # Allow manual deployment

jobs:
  # Job 1: Deploy Main App to Staging
  deploy-platform-staging:
    name: Deploy Platform to Staging (Port 3070)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Run database migrations
        run: |
          if [ -d "prisma/migrations" ]; then
            echo "✅ Running staging migrations..."
            npx prisma migrate deploy
          else
            echo "❌ ERROR: No migrations directory found"
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NEXTAUTH_URL: ${{ secrets.STAGING_NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.STAGING_NEXTAUTH_SECRET }}
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.STAGING_APP_URL }}
          NEXT_PUBLIC_MARKETING_URL: ${{ secrets.STAGING_MARKETING_URL }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Stripe TEST keys for staging
          STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STAGING_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
          # PayPal SANDBOX keys for staging
          PAYPAL_CLIENT_ID: ${{ secrets.STAGING_PAYPAL_CLIENT_ID }}
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ secrets.STAGING_PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.STAGING_PAYPAL_CLIENT_SECRET }}

      # Deploy to Railway Staging
      - name: Deploy to Railway Staging
        run: |
          npm install -g @railway/cli
          railway up --service platform-staging --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # Job 2: Deploy Marketing Site to Staging
  deploy-marketing-staging:
    name: Deploy Marketing Site to Staging (Port 3071)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'marketing/package-lock.json'

      - name: Install marketing dependencies
        run: cd marketing && npm ci

      - name: Build marketing site
        run: cd marketing && npm run build

      # Deploy to Railway Staging
      - name: Deploy marketing to Railway Staging
        run: |
          npm install -g @railway/cli
          cd marketing && railway up --service marketing-staging --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # Job 3: Post-Deployment Health Check
  health-check-staging:
    name: Staging Health Check
    runs-on: ubuntu-latest
    needs: [deploy-platform-staging, deploy-marketing-staging]

    steps:
      - name: Wait for deployment propagation
        run: sleep 30

      - name: Check platform health
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.STAGING_PLATFORM_URL }}/api/health)
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Staging platform health check passed (HTTP $RESPONSE)"
          else
            echo "⚠️ Staging platform health check returned HTTP $RESPONSE"
            exit 1
          fi
        continue-on-error: false

      - name: Check marketing site
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.STAGING_MARKETING_URL }})
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Staging marketing site health check passed (HTTP $RESPONSE)"
          else
            echo "⚠️ Staging marketing site returned HTTP $RESPONSE"
            exit 1
          fi
        continue-on-error: false

      - name: Notify deployment success
        run: |
          echo "✅ Staging deployment completed successfully!"
          echo "📍 Platform: ${{ secrets.STAGING_PLATFORM_URL }}"
          echo "📍 Marketing: ${{ secrets.STAGING_MARKETING_URL }}"
