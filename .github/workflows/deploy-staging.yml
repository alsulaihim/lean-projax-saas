name: CD - Deploy to Staging

# Deploy when code is pushed to staging branch
# Triggers Railway deployment via API

on:
  push:
    branches: [staging]
  workflow_dispatch: # Allow manual deployment

jobs:
  deploy-railway:
    name: Deploy to Railway Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deployment triggered
        run: |
          echo "✅ Railway deployment triggered successfully!"
          echo "📍 Monitor deployment at: https://railway.app/project/60b62950-598b-428c-8438-a1d030219bf7"
          echo ""
          echo "The deployment will:"
          echo "1. Build the application without Turbopack"
          echo "2. Generate Prisma client"
          echo "3. Run database migrations"
          echo "4. Start the Next.js server"
          echo ""
          echo "Check Railway dashboard for deployment status and logs."
