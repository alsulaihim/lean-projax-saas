name: PR - Pull Request Checks

# Runs on every pull request
# Prevents merging code with errors

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Automated code review
  review:
    name: Automated Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all checks
        run: |
          echo "🔍 Running quality checks..."

          # TypeScript compilation
          echo "📘 TypeScript check..."
          npx tsc --noEmit

          # ESLint
          echo "🔧 ESLint check..."
          npm run lint || true

          # Build test
          echo "🏗️ Build test..."
          npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          NEXTAUTH_URL: http://localhost:3070
          NEXTAUTH_SECRET: test-secret
          NEXT_PUBLIC_API_URL: http://localhost:3071

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check bundle size
        run: |
          npm run build
          du -sh .next/ || echo "Build size check"
        continue-on-error: true

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Automated checks completed! Review the workflow logs for details.'
            })
