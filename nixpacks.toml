[phases.setup]
nixPkgs = ['nodejs_20', 'openssl']

[phases.install]
cmds = ['npm install']

[phases.build]
cmds = [
  'npx prisma generate',
  'NEXTAUTH_SECRET=build-time-placeholder STRIPE_SECRET_KEY=sk_test_placeholder npm run build:prod'
]

[start]
cmd = 'npx prisma migrate deploy && npm run start:prod'
